experiment:
  id: smoke-test
  mode: controlled_ablation
  seed: 42
  query_repetitions: 1

dataset:
  adapter: jsonl
  corpus_path: benchmarks/smoke/corpus.json
  question_set: benchmarks/smoke/questions.jsonl
  capabilities:
    has_expected_answers: true
    has_relevant_documents: true
    has_relevant_segments: true
    has_evidence_spans: false
    has_reference_summaries: false

shared_pipeline:
  segment_tokens: 6000
  segment_overlap_tokens: 250
  selected_documents: 2
  retrieved_segments: 4

systems:
  - flat_vector

evaluation:
  local:
    - document_recall_at_1
    - document_recall_at_3
    - mrr
    - required_document_coverage
    - segment_recall_at_4
    - citation_precision
    - citation_recall
    - invalid_citation_rate
    - query_duration_ms
    - tool_calls
  foundry: {}

storage:
  artifacts_dir: artifacts


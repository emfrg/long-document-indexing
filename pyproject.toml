[project]
name = "long-document-indexing"
version = "0.1.0"
description = "Benchmark long-document indexing strategies for RAG systems."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]
multilexsum = [
    "datasets>=2.20",
]
maf = [
    "agent-framework-core>=1.16,<2",
]
foundry = [
    "azure-ai-evaluation>=1.18",
    "azure-identity>=1.19",
    "openai>=1.101",
]

[project.scripts]
ldi = "long_document_indexing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/long_document_indexing"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src",
    "/tests",
    "/configs",
    "/benchmarks",
    "/prompts",
    "/docs",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
